<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Neural network flowing into a TinyML chip" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36BCF7"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#312e81"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .w{stroke:#36BCF7;stroke-opacity:.18;stroke-width:1}
    .f{stroke:#a78bfa;stroke-opacity:.9;stroke-width:2}
    .flow{stroke:#36BCF7;stroke-width:2;stroke-dasharray:4 12;stroke-linecap:round;animation:dash 1.6s linear infinite}
    .pin{stroke:#a78bfa;stroke-width:3;stroke-linecap:round}
    @keyframes dash{to{stroke-dashoffset:-32}}
    .t{font-family:'Courier New',monospace}
  </style>
</defs>
